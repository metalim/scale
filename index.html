<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Масштаб · от кварка до наблюдаемой Вселенной</title>
<style>
  :root{
    --ink:#e9eef7; --dim:rgba(233,238,247,.60); --dim2:rgba(233,238,247,.38);
    --accent:#8fd3ff; --stroke:rgba(233,238,247,.16);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#05070c;color:var(--ink);overflow:hidden;
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  #scene{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
  #scene.drag{cursor:grabbing}
  .hud{position:fixed;inset:0;pointer-events:none;z-index:3;animation:hudIn .8s .1s both}
  @keyframes hudIn{from{opacity:0}to{opacity:1}}
  .hud:before{content:"";position:absolute;inset:0;
    background:radial-gradient(125% 95% at 50% 48%,transparent 38%,rgba(0,0,0,.42) 100%)}

  #title{position:absolute;left:clamp(16px,2.2vw,34px);top:clamp(16px,2.2vh,26px);
    max-width:min(46vw,520px);text-shadow:0 1px 18px rgba(0,0,0,.8),0 0 3px rgba(0,0,0,.6)}
  #lExp{font:600 12.5px/1 var(--mono);color:var(--accent);letter-spacing:.04em;opacity:.92}
  #lName{font-size:clamp(23px,3.1vw,37px);line-height:1.08;margin:7px 0 6px;
    font-weight:600;letter-spacing:-.017em}
  #lSize{display:inline-block;font:500 12px/1 var(--mono);color:var(--ink);
    padding:4px 9px;border:1px solid var(--stroke);border-radius:999px;
    background:rgba(255,255,255,.05)}
  #lNote{font-size:13.5px;line-height:1.45;color:var(--dim);margin:8px 0 0}
  #title.flash{animation:tflash .55s ease-out}
  @keyframes tflash{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}

  #panel{position:absolute;right:clamp(16px,2.2vw,34px);top:clamp(16px,2.2vh,26px);
    text-align:right;text-shadow:0 1px 16px rgba(0,0,0,.85)}
  #panel .k{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim2);margin:0 0 3px}
  #panel .v{font:500 15px/1.25 var(--mono);margin:0 0 12px}
  #ratebar{width:118px;height:4px;margin:0 0 0 auto;border-radius:2px;background:rgba(255,255,255,.11);overflow:hidden}
  #ratebar i{display:block;height:100%;width:50%;border-radius:2px;
    background:linear-gradient(90deg,#5ad1ff,#b48cff)}

  #rail{position:absolute;right:6px;top:calc(50% + 12px);transform:translateY(-50%);
    width:206px;max-height:min(66vh,620px);overflow-y:auto;pointer-events:auto;
    padding:2px 0;scrollbar-width:none;
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 7%,#000 93%,transparent);
    mask-image:linear-gradient(180deg,transparent,#000 7%,#000 93%,transparent)}
  #rail::-webkit-scrollbar{width:0;height:0}
  .ri{display:flex;align-items:center;gap:9px;justify-content:flex-end;
    padding:2.5px 9px;border-radius:7px;cursor:pointer;color:var(--dim2);
    font-size:11.5px;line-height:1.2;transition:color .16s,background .16s;
    white-space:nowrap;text-shadow:0 1px 10px rgba(0,0,0,.75)}
  .ri .n{overflow:hidden;text-overflow:ellipsis}
  .ri .e{font:500 9.5px var(--mono);opacity:.62;min-width:32px;text-align:right}
  .ri:hover{color:var(--ink);background:rgba(255,255,255,.07)}
  .ri.on{color:#fff;background:linear-gradient(90deg,rgba(143,211,255,0),rgba(143,211,255,.13))}
  .ri.on .n{font-weight:600}
  .ri.on .e{opacity:1;color:var(--accent)}

  #bar{position:absolute;left:0;right:0;bottom:0;padding:0 18px 15px;
    display:flex;flex-direction:column;align-items:center;gap:9px}
  #hint{font-size:11.5px;color:var(--dim2);text-align:center;
    text-shadow:0 1px 12px rgba(0,0,0,.85)}
  #btns{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:center}
  button{font:500 12px/1 inherit;color:var(--ink);padding:8px 13px;cursor:pointer;
    background:rgba(255,255,255,.055);border:1px solid var(--stroke);border-radius:999px;
    backdrop-filter:blur(7px);transition:.16s}
  button:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.3)}
  button.on{background:rgba(143,211,255,.19);border-color:rgba(143,211,255,.55);color:#fff}

  #prog{position:fixed;left:0;top:0;height:2px;width:100%;background:rgba(255,255,255,.07);z-index:4}
  #prog i{display:block;height:100%;width:0;
    background:linear-gradient(90deg,rgba(150,120,255,.9),rgba(143,211,255,.9),rgba(255,190,120,.9))}

  @media (max-width:860px){ #rail{display:none} #title{max-width:72vw} }
  @media (max-width:520px){ #lNote{display:none} }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="hud" id="hud">
  <div id="title">
    <div id="lExp">10⁰ м</div>
    <h1 id="lName">Человек</h1>
    <div><span id="lSize">1,75 м</span></div>
    <p id="lNote"></p>
  </div>

  <div id="panel">
    <p class="k">в кадре по вертикали</p>
    <p class="v" id="vFrame">—</p>
    <p class="k">темп времени</p>
    <p class="v" id="vRate" title="Единые часы для всех уровней: темп = 10^(0,05 · масштаб), ограничен 0,08…10. Зависит только от текущего зума.">×1,00</p>
    <div id="ratebar"><i id="ratebarI"></i></div>
  </div>

  <nav id="rail"></nav>

  <div id="bar">
    <div id="hint">колесо — зум · перетаскивание — сдвиг · ← → — уровни · пробел — автозум</div>
    <div id="btns">
      <button id="bAuto">Автозум</button>
      <button id="bHome">Человек</button>
      <button id="bTop">Горизонт Вселенной</button>
    </div>
  </div>
</div>
<div id="prog"><i id="progI"></i></div>

<script>
(() => {
'use strict';
/* ============================================================================
   МАСШТАБ — один физический лог-зум от кварка до наблюдаемой Вселенной.

   Мир один: все объекты стоят в начале координат в метрах, у каждого уровня
   своя характерная величина (LEVELS[].e = log10 метров).
   Камера: cam.z = log10(метров в высоте кадра) — то есть кадр всегда
   охватывает 10^cam.z метров по вертикали. Отсюда физичность: масштаб
   объекта на экране = 10^(e - cam.z).
   Время одно на всю сцену: simT растёт со скоростью rate(cam.z) —
   функция только текущего зума.
   ========================================================================== */

/* ------------------------------ утилиты ---------------------------------- */
const TAU = Math.PI*2;
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp  = (a,b,u) => a+(b-a)*u;
const sstep = u => { u = clamp(u,0,1); return u*u*(3-2*u); };
function mkRnd(seed){ let a = seed|0; return function(){ a = a+0x6D2B79F5|0;
  let t = Math.imul(a^a>>>15, 1|a); t = t+Math.imul(t^t>>>7, 61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
function rgba(col,a){
  if(col.charAt(0) !== '#') return col;
  let h = col.slice(1);
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const n = parseInt(h,16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
const SUP = {'-':'⁻','+':'','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','.':'·',',':','};
const sup = s => String(s).split('').map(ch => SUP[ch] !== undefined ? SUP[ch] : ch).join('');
function num(x,d){ if(!isFinite(x)) return '—';
  const a = Math.abs(x);
  let s = d !== undefined ? x.toFixed(d) : (a>=100?x.toFixed(0):a>=10?x.toFixed(1):a>=1?x.toFixed(2):x.toPrecision(2));
  return s.replace('.',',');
}
const LY = 9.4607e15, AU = 1.495978707e11;
const UNITS = [[LY*1e9,'млрд св. лет'],[LY*1e6,'млн св. лет'],[LY*1e3,'тыс. св. лет'],[LY,'св. лет'],
  [AU*1e3,'млрд км'],[AU,'а.е.'],[1e11,'млн км'],[1e8,'тыс. км'],[1e3,'км'],[1,'м'],
  [1e-2,'см'],[1e-3,'мм'],[1e-6,'мкм'],[1e-9,'нм'],[1e-12,'пм'],[1e-15,'фм'],[1e-18,'ам']];
function friendly(m){ if(!(m>0) || !isFinite(m)) return '—';
  for(const u of UNITS) if(m >= u[0]) return num(m/u[0])+' '+u[1];
  return num(m*1e18,0)+' ам'; }

/* --------------------- векторные примитивы (в единицах уровня) ----------- */
let CURS = 1;                                // пикселей на каноническую единицу
const INK = '#0a0e17';
function lw(c,p){ c.lineWidth = Math.max(p/CURS, 1e-7); }
function poly(c,pts,open){ c.beginPath();
  for(let i=0;i<pts.length;i++){ const p = pts[i]; i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]); }
  if(!open) c.closePath(); }
function smoothPath(c,pts){ const n = pts.length; c.beginPath();
  for(let i=0;i<n;i++){ const p0 = pts[(i-1+n)%n], p1 = pts[i], p2 = pts[(i+1)%n];
    const ax = (p0[0]+p1[0])/2, ay = (p0[1]+p1[1])/2, bx = (p1[0]+p2[0])/2, by = (p1[1]+p2[1])/2;
    if(i===0) c.moveTo(ax,ay);
    c.quadraticCurveTo(p1[0],p1[1],bx,by); }
  c.closePath(); }
function capsulePath(c,x0,x1,y,r){ c.beginPath(); c.moveTo(x1,y-r);
  c.arc(x1,y,r,-Math.PI/2,Math.PI/2); c.lineTo(x0,y+r); c.arc(x0,y,r,Math.PI/2,Math.PI*1.5); c.closePath(); }
function rrectPath(c,w,h,r0){ const r = Math.min(r0,w/2,h/2), x = w/2, y = h/2;
  c.beginPath(); c.moveTo(-x+r,-y); c.lineTo(x-r,-y); c.arcTo(x,-y,x,y,r);
  c.lineTo(x,y-r); c.arcTo(x,y,x-r,y,r); c.lineTo(-x+r,y); c.arcTo(-x,y,-x,y-r,r);
  c.lineTo(-x,-y+r); c.arcTo(-x,-y,-x+r,-y,r); c.closePath(); }
function starPath(c,x,y,R,n,rot,inner){ c.beginPath();
  for(let i=0;i<n*2;i++){ const a = rot + i*Math.PI/n, r = (i%2) ? R*inner : R;
    const px = x+Math.cos(a)*r, py = y+Math.sin(a)*r; i?c.lineTo(px,py):c.moveTo(px,py); }
  c.closePath(); }
function fill(c,col){ c.fillStyle = col; c.fill(); }
function strk(c,col,p){ c.strokeStyle = col; lw(c,p); c.stroke(); }
function strkC(c,col,w){ c.strokeStyle = col; c.lineWidth = Math.max(w,1e-9); c.stroke(); }
function disc(c,x,y,r,f,s,p){ c.beginPath(); c.arc(x,y,r,0,TAU);
  if(f){ c.fillStyle = f; c.fill(); } if(s){ c.strokeStyle = s; lw(c,p||1.6); c.stroke(); } }
function ring(c,x,y,r,s,p){ c.beginPath(); c.arc(x,y,r,0,TAU); strk(c,s,p); }
function line(c,x1,y1,x2,y2,s,p){ c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); strk(c,s,p); }
function lineC(c,x1,y1,x2,y2,s,w){ c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); strkC(c,s,w); }
function arcS(c,x,y,r,a0,a1,s,p){ c.beginPath(); c.arc(x,y,r,a0,a1); strk(c,s,p); }
/* толщина w — в канонических единицах уровня, обводка s — в экранных пикселях */
function pill(c,x1,y1,x2,y2,w,f,s,ink){ c.lineCap = 'round'; c.lineJoin = 'round';
  if(s) lineC(c,x1,y1,x2,y2,ink||INK,w+s*2/CURS); lineC(c,x1,y1,x2,y2,f,w); c.lineCap = 'butt'; }
function glow(c,x,y,r,col,a0,a1){ const g = c.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0, rgba(col, a0 === undefined ? .5 : a0));
  g.addColorStop(1, rgba(col, a1 === undefined ? 0 : a1));
  c.fillStyle = g; c.beginPath(); c.arc(x,y,r,0,TAU); c.fill(); }
function glowR(c,x,y,r0,r1,col,a0,a1){ const g = c.createRadialGradient(x,y,r0,x,y,r1);
  g.addColorStop(0, rgba(col,a0)); g.addColorStop(1, rgba(col,a1));
  c.fillStyle = g; c.beginPath(); c.arc(x,y,r1,0,TAU); c.fill(); }
/* размер px — в канонических единицах уровня (подпись часть рисунка),
   но слишком мелкое на экране не рисуем */
const fontOf = (px,weight) => (weight||600)+' '+px+'px ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif';
function txt(c,x,y,s,px,col,align,weight){
  if(!(px > 1e-6) || px*CURS < 3.5) return;
  c.font = fontOf(px,weight);
  c.textAlign = align||'center'; c.textBaseline = 'middle'; c.fillStyle = col; c.fillText(s,x,y); }
function txtH(c,x,y,s,px,col,align,weight,halo){
  if(!(px > 1e-6) || px*CURS < 3.5) return;
  c.font = fontOf(px,weight);
  c.textAlign = align||'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  c.strokeStyle = halo||'rgba(3,5,10,.85)'; c.lineWidth = Math.max(2.6/CURS,1e-7);
  c.strokeText(s,x,y); c.fillStyle = col; c.fillText(s,x,y); }
function spring(c,ax,ay,bx,by,amp,seg,ph,col,p){
  const dx = bx-ax, dy = by-ay, L = Math.hypot(dx,dy)||1e-6, nx = -dy/L, ny = dx/L, pts = [];
  for(let i=0;i<=seg;i++){ const q = i/seg;
    const o = (i%2?1:-1)*amp*Math.sin(q*Math.PI)*Math.cos(ph*3+q*4);
    pts.push([lerp(ax,bx,q)+nx*o, lerp(ay,by,q)+ny*o]); }
  poly(c,pts,true); strk(c,col,p); }
function randPoly(rnd,n,R,irr,cx,cy,ry){ const pts = [];
  for(let i=0;i<n;i++){ const a = i/n*TAU+(rnd()-.5)*.5, r = R*(1-irr*rnd());
    pts.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r*(ry||1)]); }
  return pts; }
/* облако: несколько наложенных эллипсов, а не круги */
function cloud(c,x,y,s,col){
  for(let i=0;i<4;i++){ const dx = (i-1.5)*s*.55, dy = (i%2?-1:1)*s*.10;
    c.beginPath();
    c.ellipse(x+dx, y+dy, s*((i===1||i===2)?1:.72), s*((i===1||i===2)?.34:.26), 0,0,TAU);
    fill(c,col); }
}
/* маленькая спиральная галактика в локальных координатах */
function galaxy(c,R,phase,hue){
  glow(c,0,0,R*1.15,hue,.30,0);
  const g2 = c.createRadialGradient(0,0,0,0,0,R);
  g2.addColorStop(0, rgba(hue,.55)); g2.addColorStop(.42, rgba(hue,.18)); g2.addColorStop(1, rgba(hue,0));
  c.beginPath(); c.arc(0,0,R,0,TAU); c.fillStyle = g2; c.fill();
  for(let k=0;k<2;k++){
    const pts = [];
    for(let i=0;i<=40;i++){ const q = i/40, th = phase+k*Math.PI+q*2.6, rr = R*.10*Math.exp(th*.85);
      if(rr > R*.98) break;
      pts.push([Math.cos(th)*rr, Math.sin(th)*rr]); }
    if(pts.length > 2){
      poly(c,pts,true); strk(c, rgba('#cfe0ff',.30), R*.30);
      poly(c,pts,true); strk(c, rgba('#ffffff',.45), R*.16); }
  }
  glow(c,0,0,R*.34,'#fff6e0',.8,0);
  disc(c,0,0,R*.07,'#fffdf4');
}
/* точка на ломаной: q=0..1 по длине -> [x,y,угол] */
function alongPath(pts,q){ const seg = []; let total = 0;
  for(let i=0;i<pts.length-1;i++){ const d = Math.hypot(pts[i+1][0]-pts[i][0], pts[i+1][1]-pts[i][1]);
    seg.push(d); total += d; }
  let want = q*total;
  for(let i=0;i<seg.length;i++){
    if(want <= seg[i] || i === seg.length-1){ const u = clamp(want/(seg[i]||1),0,1), a = pts[i], b = pts[i+1];
      return [lerp(a[0],b[0],u), lerp(a[1],b[1],u), Math.atan2(b[1]-a[1], b[0]-a[0])]; }
    want -= seg[i]; }
  return [pts[0][0], pts[0][1], 0];
}
function mkTex(size,fn){ const cv = document.createElement('canvas');
  cv.width = cv.height = size; fn(cv.getContext('2d'), size); return cv; }
function sparkle(c,x,y,r,col,a,long){ glow(c,x,y,r*(long?4.6:2.8),col,(a||.5)*.6,0);
  const L = r*(long?4.6:2.4), W = r*(long?.34:.28);
  c.save(); c.translate(x,y);
  for(let k=0;k<2;k++){ c.beginPath(); c.moveTo(0,-L);
    c.quadraticCurveTo(W,0,0,L); c.quadraticCurveTo(-W,0,0,-L);
    fill(c, rgba(col,(a||.5)*.85)); c.rotate(Math.PI/2); }
  c.restore(); disc(c,x,y,r*.6,'#fff'); }

/* =============================== УРОВНИ ================================== */
const LEVELS = [

/* ------------------------------------------------------------- КВАРК ---- */
{ e:-17.5, name:'Кварк и глюоны', size:'< 10⁻¹⁸ м', span:.92,
  note:'Внутри нуклона: три кварка, связанные глюонными «пружинами». Свободных кварков в природе не существует — только в связке.',
  init(L){ const r = mkRnd(11);
    L.q = [0,1,2].map(i => ({ a:i*TAU/3, ph:r()*TAU, key:['R','G','B'][i],
      col:['#ff6b6b','#5ef0a0','#7d8bff'][i] }));
    L.foam = []; for(let i=0;i<16;i++) L.foam.push({a:r()*TAU, d:.72+r()*.32, r:.006+r()*.018, ph:r()*TAU}); },
  draw(g){ const c = g.c, t = g.t, L = g.L;
    glow(c,0,0,1.06,'#7b5cff',.30,0);
    glowR(c,0,0,.7,1.04,'#a78bfa',.15,0);
    ring(c,0,0,.99,'rgba(167,139,250,.42)',1.5);
    ring(c,0,0,.93,'rgba(167,139,250,.13)',5);
    const P = L.q.map(q => { const a = q.a+.30*Math.sin(t*.9+q.ph), d = .40+.06*Math.sin(t*1.5+q.ph*2);
      return [Math.cos(a)*d, Math.sin(a)*d]; });
    for(let i=0;i<3;i++) spring(c,P[i][0],P[i][1],P[(i+1)%3][0],P[(i+1)%3][1],.055,9,t*1.6+i,'rgba(214,192,255,.9)',2.6);
    L.q.forEach((q,i) => { const x = P[i][0], y = P[i][1];
      glow(c,x,y,.34,q.col,.42,0);
      disc(c,x,y,.215,q.col,INK,2.2);
      disc(c,x-.07,y-.08,.062,'rgba(255,255,255,.85)');
      txtH(c,x,y+.002,q.key,.17,'rgba(10,14,23,.9)','center',700); });
    for(const s of L.foam) disc(c,Math.cos(s.a)*s.d, Math.sin(s.a)*s.d,
      s.r*(1+.4*Math.sin(t*2+s.ph)), rgba('#d8c9ff', .12+.22*Math.max(0,Math.sin(t*1.5+s.ph)))); } },

/* ------------------------------------------------------------ ПРОТОН ---- */
{ e:-15, name:'Протон', size:'0,84·10⁻¹⁵ м', span:1,
  note:'Три кварка и глюонное поле, удерживающее их вместе. Ядро в 100 000 раз меньше атома, но в нём почти вся его масса.',
  init(L){ const r = mkRnd(12);
    L.q = [0,1,2].map(i => ({ a:i*TAU/3+.4, ph:r()*TAU, key:['u','u','d'][i],
      col:['#ff7a5c','#ffd166','#7fb2ff'][i] })); },
  draw(g){ const c = g.c, t = g.t, L = g.L;
    const R = 1 + .012*Math.sin(t*1.2);
    glow(c,0,0,1.5,'#ff9b5c',.28,0);
    c.beginPath(); c.arc(0,0,R,0,TAU);

/* ------------------------------------------------------ МОЛЕКУЛА ДНК ---- */
{ e:-9, name:'Молекула ДНК', size:'2·10⁻⁹ м', span:1,
  note:'Двойная спираль: два сахарофосфатных остова и перекладины из пар оснований. Шаг спирали — 3,4 нм, виток — 10 пар.',
  init(L){ const r = mkRnd(51); const COLS = ['#ff8fa3','#ffd166','#8ad6ff','#a8e07a'];
    L.rungs = []; for(let i=0;i<20;i++){ const y = -.95+i*(1.9/19);
      L.rungs.push({ y, k:r()*.6+.2, c1:COLS[Math.floor(r()*4)], c2:COLS[Math.floor(r()*4)] }); } },
  draw(g){ const c = g.c, t = g.t, L = g.L;
    const A = .85, K = 6.0, ph = t*1.1;
    const halves = [];
    for(const r2 of L.rungs){ const s = Math.sin(r2.y*K+ph), dz = Math.cos(r2.y*K+ph);
      halves.push({ y:r2.y, x0:-s*A, x1:0, z:-dz, col:r2.c1, k:r2.k });
      halves.push({ y:r2.y, x0:0, x1:s*A, z:dz, col:r2.c2, k:r2.k }); }
    const back = halves.filter(h => h.z < 0).sort((a,b) => a.z-b.z);
    const front = halves.filter(h => h.z >= 0).sort((a,b) => a.z-b.z);
    const drawHalf = h => { const u = (h.z+1)/2, w = .022+.030*h.k;
      lineC(c,h.x0,h.y,h.x1,h.y, 'rgba(10,14,23,.8)', w+.020);
      lineC(c,h.x0,h.y,h.x1,h.y, rgba(h.col,.30+.65*u), w); };
    for(const h of back) drawHalf(h);
    for(const sgn of [-1,1]){ const pts = [];
      for(let i=0;i<=72;i++){ const y = -1.04+i*(2.08/72); pts.push([sgn*Math.sin(y*K+ph)*A, y]); }
      poly(c,pts,true); strkC(c,'rgba(14,20,32,.85)',.105);
      poly(c,pts,true); strkC(c,'rgba(150,180,215,.95)',.072);
      poly(c,pts,true); strkC(c,'rgba(222,240,255,.85)',.030); }
    for(const h of front) drawHalf(h);
    line(c,-A,-1.20,A,-1.20,'rgba(215,235,255,.45)',1.2);
    line(c,-A,-1.24,-A,-1.16,'rgba(215,235,255,.45)',1.2);
    line(c,A,-1.24,A,-1.16,'rgba(215,235,255,.45)',1.2);
    txtH(c,0,-1.32,'⌀ 2 нм · виток 10 пар оснований',.075,'rgba(215,235,255,.75)','center',500); } },

/* -------------------------------------------------------- БАКТЕРИОФАГ -- */
{ e:-7, name:'Бактериофаг', size:'≈10⁻⁷ м', span:1,
  note:'Вирус-хищник бактерий: головка с ДНК, хвост-шприц и шесть лапок-опор. Сто нанометров — предел светового микроскопа.',
  init(L){ const r = mkRnd(61);
    L.legs = []; for(let i=0;i<6;i++) L.legs.push({ a:(i/6)*TAU+.2, ph:r()*TAU, k:.85+r()*.3 }); },
  draw(g){ const c = g.c, t = g.t, L = g.L;
    const hy = -.46, hr = .40;
    const leg = l => { const front = Math.sin(l.a) >= 0, ca = Math.cos(l.a);
      const bend = .06*Math.sin(t*1.5+l.ph);
      const kx = ca*.46, ky = .38+bend, fx = ca*(.60+l.k*.16), fy = .74+bend*1.5;
      const col = front ? '#cfd9ea' : '#8d99ad', sp = front ? 1.9 : 1.4;
      const seg = (x1,y1,x2,y2,w) => { if(sp>1.5) line(c,x1,y1,x2,y2,INK,w+sp);
        line(c,x1,y1,x2,y2,col,w); };
      seg(ca*.17,.30,kx,ky,3.4); seg(kx,ky,fx,fy,3); };
    for(const l of L.legs) if(Math.sin(l.a) < 0) leg(l);
    // хвост
    const sh = .17, sy0 = -.08, sy1 = .30;
    c.beginPath(); c.rect(-sh/2, sy0, sh, sy1-sy0);
    fill(c,'#c6d2e6'); strk(c,INK,2);
    for(let i=1;i<5;i++){ const y = sy0+i*(sy1-sy0)/5;
      line(c,-sh/2,y,sh/2,y,'rgba(10,14,23,.42)',1.2); }
    // воротничок и базальная пластина
    c.beginPath(); c.rect(-.16,-.14,.32,.07); fill(c,'#98a5bb'); strk(c,INK,1.8);
    c.beginPath(); c.moveTo(-.10,.30); c.lineTo(.10,.30); c.lineTo(.20,.40); c.lineTo(-.20,.40);
    c.closePath(); fill(c,'#8b7cff'); strk(c,INK,2);
    // головка-икосаэдр
    c.save(); c.translate(0,hy);
    const g6 = []; for(let i=0;i<6;i++){ const a = i*TAU/6+Math.PI/6; g6.push([Math.cos(a)*hr, Math.sin(a)*hr]); }
    poly(c,g6); fill(c,'#4fd1c5'); strk(c,INK,2.4);
    for(const p of g6){ poly(c,[[0,0],p,[0,-hr*1.0]]); strk(c,'rgba(10,14,23,.35)',1.2); }
    poly(c,[g6[0],g6[1],g6[2]]); fill(c,'rgba(255,255,255,.22)');
    c.beginPath(); c.arc(-hr*.34,-hr*.34,hr*.30,0,TAU); fill(c,'rgba(255,255,255,.30)');
    c.restore();
    for(const l of L.legs) if(Math.sin(l.a) >= 0) leg(l);
    txtH(c,0,-1.28,'бактериофаг T4',.07,'rgba(210,230,240,.5)','center',500); } },

{ e:-5, name:'Животная клетка', size:'2·10⁻⁵ м', span:1,
  note:'20 микрон: мембрана, ядро с ДНК, митохондрии-электростанции, ЭПС и аппарат Гольджи. Всё это — одна клетка.',

/* -------------------------------------------------------------- ВОЛОС -- */
{ e:-4, name:'Человеческий волос', size:'70·10⁻⁶ м', span:1,
  note:'70 микрон в толщину. Снаружи — чешуйки кутикулы, уложенные как черепица; именно они дают блеск.',
  init(L){ const r = mkRnd(91);
    L.st = [{ x0:-1.20, y0:-.58, x1:1.20, y1:.50, bend:.28, w:.140, col:'#cf9f6d', sp:.9, ph:r() },
            { x0:-1.15, y0:.76,  x1:1.15, y1:-.42, bend:-.24, w:.108, col:'#a8764a', sp:1.1, ph:r() },
            { x0:-1.05, y0:-1.08, x1:1.05, y1:.16, bend:.20, w:.082, col:'#e2b686', sp:1.3, ph:r() }]; },
  draw(g){ const c = g.c, t = g.t, L = g.L;
    glow(c,0,0,1.3,'#c98a4a',.11,0);
    for(const s of L.st){
      const dx = s.x1-s.x0, dy = s.y1-s.y0, len = Math.hypot(dx,dy);
      const ux = dx/len, uy = dy/len, nx = -uy, ny = ux;
      const P = q => { const k = Math.sin(q*Math.PI)*s.bend + .020*Math.sin(t*.8+s.ph*7);
        return [s.x0+dx*q+nx*k, s.y0+dy*q+ny*k]; };
      const pts = []; for(let i=0;i<=44;i++) pts.push(P(i/44));
      const shift = a => pts.map(p => [p[0]+nx*a, p[1]+ny*a]);
      poly(c,pts,true); strkC(c,INK, s.w+.045);
      poly(c,pts,true); strkC(c, s.col, s.w);
      poly(c,shift(-s.w*.26),true); strkC(c, rgba('#fff3dd',.34), s.w*.32);
      poly(c,shift( s.w*.30),true); strkC(c, rgba('#5a3a20',.26), s.w*.28);
      // медулла

      // чешуйки кутикулы, налегающие друг на друга
      const step = s.w*.92;
      for(let d = step; d < len-step; d += step){
        const p = P(d/len);
        c.beginPath();
        c.moveTo(p[0]+nx*s.w*.48, p[1]+ny*s.w*.48);
        c.quadraticCurveTo(p[0]+ux*step*.7, p[1]+uy*step*.7, p[0]-nx*s.w*.48, p[1]-ny*s.w*.48);
        strkC(c,'rgba(58,34,14,.26)',.018); }
      // бегущий блик
      const gq = ((t*.15*s.sp+s.ph)%1);
      for(let i=0;i<12;i++){ const q = clamp(gq-i*.014,0,1), p = P(q), a = (1-i/12);

/* --------------------------------------------------------- КИСТЬ РУКИ -- */
{ e:-1, name:'Кисть руки', size:'≈0,2 м', span:.92,
  note:'Двадцать сантиметров: ладонь и пять пальцев. Сгибание пальца задают сухожилия, а не мышцы на самой руке.',
  init(L){ L.fing = [
      { x:-.125, l1:.215, l2:.185, a1:-1.86, sp:1.00, w:.100 },
      { x: 0.000, l1:.245, l2:.205, a1:-1.56, sp:1.06, w:.108 },
      { x:  .125, l1:.225, l2:.190, a1:-1.30, sp: .96, w:.100 },
      { x:  .245, l1:.165, l2:.140, a1:-1.08, sp: .80, w:.088 } ]; },
  draw(g){ const c = g.c, t = g.t, L = g.L;
    const SK = '#f3c99f', PALM = [[-.255,.06],[-.285,.36],[-.235,.70],[.215,.70],[.275,.36],[.245,.06]];
    c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
    c.translate(0,-.14); c.rotate(-.05+.015*Math.sin(t*.9));
    glow(c,-.02,.24,1.25,'#e8b57e',.12,0);
    const fingers = L.fing.map((f,i) => {
      const wig = .085*Math.sin(t*1.5-i*.55)*f.sp;
      const a1 = f.a1+wig, a2 = f.a1+wig*.55-.12;
      const b = [f.x,.12];
      const j1 = [b[0]+Math.cos(a1)*f.l1, b[1]+Math.sin(a1)*f.l1];
      const j2 = [j1[0]+Math.cos(a2)*f.l2, j1[1]+Math.sin(a2)*f.l2];
      return { pts:[b,j1,j2], w:f.w };
    });
    const th = .95+.10*Math.sin(t*1.3), tb = [-.21,.30];
    const tj1 = [tb[0]+Math.cos(-Math.PI+th)*.20, tb[1]+Math.sin(-Math.PI+th)*.20];
    const tj2 = [tj1[0]+Math.cos(-Math.PI+th+.75)*.17, tj1[1]+Math.sin(-Math.PI+th+.75)*.17];
    fingers.push({ pts:[tb,tj1,tj2], w:.112, thumb:true });
    // два прохода: сначала контур, потом кожа — получается слитный силуэт
    const pass = (col,d) => {
      for(const f of fingers) for(let i=0;i<2;i++){
        const p = f.pts[i], q = f.pts[i+1], w = f.w*(1-i*.10)+d;
        line(c,p[0],p[1],q[0],q[1], col, Math.max(w*CURS,1)); }
      smoothPath(c, PALM.map(p => [p[0]*(1+d*1.5), .38+(p[1]-.38)*(1+d)])); fill(c,col);
      c.save(); c.translate(0,.755); rrectPath(c,.50+d*2,.21+d*2,.07); fill(c,col); c.restore(); };
    pass(INK,.020); pass(SK,0);
    // суставные складки
    for(const f of fingers){ const j1 = f.pts[1];
      const a1 = Math.atan2(f.pts[1][1]-f.pts[0][1], f.pts[1][0]-f.pts[0][0]);
      c.save(); c.translate(j1[0],j1[1]); c.rotate(a1);
      line(c,-f.w*.40,0,f.w*.40,0,'rgba(180,120,85,.40)',1.3); c.restore(); }
    for(let i=0;i<2;i++){ const y = .30+i*.16;
      c.beginPath(); c.moveTo(-.21,y); c.quadraticCurveTo(-.02,y+.09,.24,y-.02);
      strk(c,'rgba(180,120,85,.20)',1.2); }
    c.save(); c.translate(0,.755); rrectPath(c,.50,.21,.07);
    fill(c,'#4f86e0'); strk(c,INK,2.2); c.restore();
    line(c,-.23,.735,.23,.735,'rgba(255,255,255,.25)',1.3);
    // ногти
    for(const f of fingers){ const p = f.pts[2], q = f.pts[1];
      const a = Math.atan2(p[1]-q[1], p[0]-q[0]), w = f.w*(f.thumb ? .92 : .82);
      c.save(); c.translate(p[0]+Math.cos(a)*w*.24, p[1]+Math.sin(a)*w*.24); c.rotate(a+Math.PI/2);
      c.beginPath(); c.ellipse(0,0,w*.32,w*.44,0,0,TAU);
      fill(c,'rgba(255,246,238,.95)'); strk(c,'rgba(170,120,92,.55)',1.1); c.restore(); }
    c.restore();
    c.save(); c.beginPath(); c.ellipse(.06,.94,.42,.07,0,0,TAU);
    fill(c,'rgba(0,0,0,.32)'); c.restore(); } },

  note:'Крупнейшая структура мира: нити из скоплений галактик между пустотами. В войдах галактик почти нет.',
  init(L){ const r = mkRnd(312);
    L.nodes = []; for(let i=0;i<17;i++){ const a = r()*TAU, d = Math.pow(r(),.65)*1.2;
      L.nodes.push({ x:Math.cos(a)*d, y:Math.sin(a)*d*.88, R:.055+r()*.10, ph:r()*TAU,

      strk(c,'rgba(120,160,230,.15)',7);
      c.beginPath(); c.moveTo(A.x,A.y); c.quadraticCurveTo(mx,my,B.x,B.y);
      strk(c,'rgba(180,210,255,.20)',2.4);
      for(let i=1;i<16;i++){ const q = i/16;
        const ax = lerp(A.x,mx,q), ay = lerp(A.y,my,q);
        const bx = lerp(mx,B.x,q), by = lerp(my,B.y,q);
        disc(c, lerp(ax,bx,q), lerp(ay,by,q), .0045,
          rgba('#cfe0ff', .22+.35*Math.abs(Math.sin(t*.5+i+q*4)))); } }
    for(const n of L.nodes){
      glow(c,n.x,n.y,n.R*2.3,'#9fc0ff',.18,0);
      c.save(); c.translate(n.x,n.y); smoothPath(c,n.blob); fill(c,'rgba(58,79,128,.35)'); c.restore();
      for(const s of n.sub) disc(c, n.x+Math.cos(s.a)*s.d*n.R, n.y+Math.sin(s.a)*s.d*n.R*.9,
        s.s, rgba('#e8f0ff', .35+.5*Math.abs(Math.sin(t*.6+s.a*3))));
      disc(c,n.x,n.y,.011, rgba('#fffaf0',.8)); }
    c.restore();
    txtH(c,0,-1.32,'нити · скопления · пустоты (войды)   ·   ≈300 млн св. лет',.05,'rgba(205,225,250,.5)','center',500); } },

/* ------------------------------------------------ НАБЛЮДАЕМАЯ ВСЕЛЕННАЯ */
{ e:26.9, name:'Наблюдаемая Вселенная', size:'⌀ 93 млрд св. лет', span:1,
  note:'Всё, что мы можем увидеть: около двух триллионов галактик. На краю — реликтовое излучение, след Большого взрыва.',
  init(L){ const r = mkRnd(313);
    L.tex = mkTex(620, (cx,size) => {
      const R = size/2-2, cc = size/2, r2 = mkRnd(777);
      const bg = cx.createRadialGradient(cc,cc,0,cc,cc,R);
      bg.addColorStop(0,'#2a3f7a'); bg.addColorStop(.55,'#1d2a55'); bg.addColorStop(1,'#0d1330');
      cx.fillStyle = bg; cx.beginPath(); cx.arc(cc,cc,R,0,TAU); cx.fill();
      cx.save(); cx.beginPath(); cx.arc(cc,cc,R,0,TAU); cx.clip();
      const cols = ['#4a6fd4','#7a6fd4','#3a86c8','#c88a5a','#c85a6a','#5ac8b0'];
      for(let i=0;i<540;i++){ const a = r2()*TAU, d = Math.sqrt(r2())*R;
        const x = cc+Math.cos(a)*d, y = cc+Math.sin(a)*d, rr = size*(.012+Math.pow(r2(),2)*.055);
        const g2 = cx.createRadialGradient(x,y,0,x,y,rr), col = cols[Math.floor(r2()*cols.length)];
        g2.addColorStop(0, rgba(col,.30)); g2.addColorStop(1, rgba(col,0));
        cx.fillStyle = g2; cx.beginPath(); cx.arc(x,y,rr,0,TAU); cx.fill(); }
      cx.globalAlpha = .38;
      for(let i=0;i<46;i++){ const a0 = r2()*TAU, d0 = Math.sqrt(r2())*R*.95;
        const a1 = a0+(r2()-.5)*1.3, d1 = Math.sqrt(r2())*R*.95;
        const am = (a0+a1)/2, dm = (d0+d1)/2*1.05;
        cx.beginPath(); cx.moveTo(cc+Math.cos(a0)*d0, cc+Math.sin(a0)*d0);
        cx.quadraticCurveTo(cc+Math.cos(am)*dm, cc+Math.sin(am)*dm, cc+Math.cos(a1)*d1, cc+Math.sin(a1)*d1);
        cx.strokeStyle = r2() < .5 ? 'rgba(190,215,255,.5)' : 'rgba(255,210,170,.42)';
        cx.lineWidth = .8+r2()*1.8; cx.stroke(); }
      cx.globalAlpha = 1; cx.restore(); });
    L.stars = []; for(let i=0;i<140;i++) L.stars.push({ x:(r()*2-1)*1.6, y:(r()*2-1)*1.6,
      s:.002+r()*.005, ph:r()*TAU }); },
  draw(g){ const c = g.c, t = g.t, L = g.L;
    for(const s of L.stars) disc(c,s.x,s.y,s.s, rgba('#cfe0ff', .1+.35*Math.max(0,Math.sin(t*.5+s.ph))));
    const R = .92*(1+.004*Math.sin(t*.4));
    glow(c,0,0,R*2.1,'#4a6fd4',.18,0);
    glowR(c,0,0,R*.5,R*1.5,'#3a5cb0',.14,0);
    c.save(); c.beginPath(); c.arc(0,0,R,0,TAU); c.clip();
    c.rotate(t*.012); c.drawImage(L.tex, -R, -R, 2*R, 2*R); c.restore();
    glowR(c,0,0,R*.96,R*1.12,'#9fc0ff',.30,0);
    ring(c,0,0,R,'rgba(180,210,255,.55)',2);
    const pl = .6+.4*Math.sin(t*1.5);
    glow(c,0,0,.05,'#fff6d8',.45*pl,0);
    disc(c,0,0,.011,'#fffdf0');
    ring(c,0,0,.034, rgba('#fff0c0',.5*pl),1.3);
    txtH(c,.055,.036,'мы здесь',.036,'rgba(255,245,215,.9)','left',600);
    c.save(); c.setLineDash([.04,.04]);
    line(c,0,0,R*Math.cos(-2.3),R*Math.sin(-2.3),'rgba(200,225,255,.45)',1.2); c.setLineDash([]); c.restore();
    txtH(c,-.58,-.70,'46,5 млрд св. лет',.05,'rgba(210,230,255,.8)','center',500);
    txtH(c,0,-1.30,'горизонт наблюдаемой Вселенной · 13,8 млрд лет',.05,'rgba(205,225,250,.5)','center',500); } },

/* <<<УРОВНИ>>> */
];

/* =============================== ДВИЖОК ================================== */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 1, H = 1, MIN = 1, DPR = 1;
const cam = { z:0, x:0, y:0, tz:0, tx:0, ty:0 };
let simT = 0, autoOn = false, autoDir = -1;
const MINZ = -19.6, MAXZ = 28.2;
const mpp = z => Math.pow(10,z)/H;
const rate = z => clamp(Math.pow(10, .05*z), .08, 10);

LEVELS.sort((a,b) => a.e-b.e);
for(const L of LEVELS) if(L.init) L.init(L);

const BG = [[-20,[9,5,20]],[-15,[11,7,24]],[-11,[8,11,28]],[-6,[7,14,22]],[-1,[10,12,18]],
  [2,[8,10,17]],[6,[6,9,19]],[10,[4,6,16]],[15,[3,4,12]],[21,[2,3,9]],[29,[1,2,7]]];
function bgColor(z){
  if(z <= BG[0][0]) return 'rgb('+BG[0][1].join(',')+')';
  for(let i=0;i<BG.length-1;i++) if(z <= BG[i+1][0]){
    const u = (z-BG[i][0])/(BG[i+1][0]-BG[i][0]);
    return 'rgb('+BG[i][1].map((v,k) => Math.round(lerp(v,BG[i+1][1][k],u))).join(',')+')'; }
  return 'rgb('+BG[BG.length-1][1].join(',')+')';
}

/* какие уровни видны при данном зуме и с какой прозрачностью */
function visible(z){
  const n = LEVELS.length;
  if(z <= LEVELS[0].e) return [[LEVELS[0],1]];
  if(z >= LEVELS[n-1].e) return [[LEVELS[n-1],1]];
  let i = 0; while(i < n-2 && LEVELS[i+1].e <= z) i++;
  const a = LEVELS[i], b = LEVELS[i+1];
  const f = (z-a.e)/(b.e-a.e), u = sstep((f-.28)/.44);
  const out = [];
  if(u > .004) out.push([b,u]);            // крупный объект — снизу
  if(1-u > .004) out.push([a,1-u]);        // мелкий, «проявляющийся» — сверху
  return out;
}

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(320, window.innerWidth); H = Math.max(320, window.innerHeight);
  canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  MIN = Math.min(W,H);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildRail();
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = bgColor(cam.z);
  ctx.fillRect(0,0,W,H);
  const m = mpp(cam.z), ox = W/2-cam.x/m, oy = H/2-cam.y/m;
  for(const [lvl,al] of visible(cam.z)){
    const d = clamp(lvl.e-cam.z, -3.6, 3.6);
    const S = .30*MIN*(lvl.span||1)*Math.pow(10,d);
    if(!(S > 1e-9) || !isFinite(S)) continue;
    ctx.save();
    ctx.globalAlpha = al;
    ctx.translate(ox,oy); ctx.scale(S,S);
    CURS = S;
    try { lvl.draw({ c:ctx, S, t:simT, d, MIN, W, H, L:lvl }); }
    catch(err){ if(!lvl._bad){ lvl._bad = 1; console.warn('уровень '+lvl.name, err); } }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  const vg = ctx.createRadialGradient(W/2,H/2,MIN*.30,W/2,H/2,MIN*.98);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.5)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
}

function clampCam(){
  const m = mpp(cam.z), hx = .5*W*m*.72, hy = .5*H*m*.72;
  cam.x = clamp(cam.x,-hx,hx); cam.y = clamp(cam.y,-hy,hy);
  cam.tx = clamp(cam.tx,-hx,hx); cam.ty = clamp(cam.ty,-hy,hy);
}

let last = 0;
function frame(now){
  if(!last) last = now;
  const dt = Math.min(.05, Math.max(0,(now-last)/1000)); last = now;
  if(autoOn){
    cam.tz = clamp(cam.tz+autoDir*1.3*dt, MINZ+.5, MAXZ-.5);
    if(cam.tz <= MINZ+.51) autoDir = 1;
    if(cam.tz >= MAXZ-.51) autoDir = -1;
  }
  const k = 1-Math.exp(-dt*6.5);
  cam.z += clamp((cam.tz-cam.z)*k, -32*dt, 32*dt);
  cam.x += (cam.tx-cam.x)*k; cam.y += (cam.ty-cam.y)*k;
  clampCam();
  simT += dt*rate(cam.z);
  render();
  hud();
  requestAnimationFrame(frame);
}

/* ------------------------------- интерфейс -------------------------------- */
const $ = id => document.getElementById(id);
const elTitle = $('title'), elName = $('lName'), elSize = $('lSize'), elNote = $('lNote'), elExp = $('lExp');
const elFrame = $('vFrame'), elRate = $('vRate'), elBar = $('ratebarI'), elRail = $('rail'), elProg = $('progI');
let curLvl = null, lastFrameTxt = '', lastRateTxt = '';
const rows = [];

function buildRail(){
  if(rows.length) return;
  LEVELS.forEach((L,idx) => {
    const d = document.createElement('div');
    d.className = 'ri';
    d.innerHTML = '<span class="n"></span><span class="e">10'+sup(L.e.toFixed(L.e%1?1:0))+'</span>';
    d.querySelector('.n').textContent = L.name;
    d.addEventListener('click', () => { goLevel(idx); });
    elRail.appendChild(d); rows.push(d);
  });
}
function nearest(z){ let best = LEVELS[0], bd = 1e9;
  for(const L of LEVELS){ const d = Math.abs(L.e-z); if(d < bd){ bd = d; best = L; } }
  return best; }

function hud(){
  const L = nearest(cam.z);
  if(L !== curLvl){
    curLvl = L;
    elExp.textContent = '10'+sup(L.e.toFixed(L.e%1?1:0))+' м';
    elName.textContent = L.name;
    elSize.textContent = L.size;
    elNote.textContent = L.note;
    elTitle.classList.remove('flash'); void elTitle.offsetWidth; elTitle.classList.add('flash');
    const idx = LEVELS.indexOf(L);
    rows.forEach((r,i) => r.classList.toggle('on', i === idx));
    const r = rows[idx];
    if(r){ const want = r.offsetTop-elRail.clientHeight/2+r.offsetHeight/2;
      elRail.scrollTo({ top:clamp(want,0,elRail.scrollHeight-elRail.clientHeight), behavior:'smooth' }); }
  }
  const ft = friendly(Math.pow(10,cam.z));
  if(ft !== lastFrameTxt){ lastFrameTxt = ft; elFrame.textContent = '≈ '+ft; }
  const rr = rate(cam.z), rt = '×'+num(rr, rr<1?3:2);
  if(rt !== lastRateTxt){ lastRateTxt = rt; elRate.textContent = rt;
    const lo = Math.log10(.08), hi = Math.log10(10);
    elBar.style.width = (100*(Math.log10(rr)-lo)/(hi-lo)).toFixed(1)+'%'; }
  elProg.style.width = (100*clamp((MAXZ-cam.z)/(MAXZ-MINZ),0,1)).toFixed(2)+'%';
}

/* --------------------------------- ввод ---------------------------------- */
function zoomAt(mx,my,dz){
  const nz = clamp(cam.tz+dz, MINZ, MAXZ);
  const m0 = Math.pow(10,cam.tz)/H, m1 = Math.pow(10,nz)/H;
  cam.tx += (mx-W/2)*(m0-m1);
  cam.ty += (my-H/2)*(m0-m1);
  cam.tz = nz;
  autoOn = false; syncAuto();
}
function goLevel(i){
  const L = LEVELS[clamp(i,0,LEVELS.length-1)];
  cam.tz = clamp(L.e, MINZ, MAXZ); cam.tx = 0; cam.ty = 0;
  autoOn = false; syncAuto();
}
function syncAuto(){ $('bAuto').classList.toggle('on', autoOn); }

window.addEventListener('wheel', e => {
  if(e.target && e.target.closest && e.target.closest('#rail')) return;
  e.preventDefault();
  const dy = e.deltaMode === 1 ? e.deltaY*16 : (e.deltaMode === 2 ? e.deltaY*H : e.deltaY);
  zoomAt(e.clientX, e.clientY, -dy*.0016);
}, { passive:false });

const ptrs = new Map();
let pinchD = 0;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  canvas.classList.add('drag');
  autoOn = false; syncAuto();
});
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if(!p) return;
  const dx = e.clientX-p.x, dy = e.clientY-p.y;
  p.x = e.clientX; p.y = e.clientY;
  if(ptrs.size >= 2){
    const a = [...ptrs.values()];
    const d = Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
    if(pinchD > 0) zoomAt((a[0].x+a[1].x)/2, (a[0].y+a[1].y)/2, Math.log10(d/pinchD));
    pinchD = d;
    return;
  }
  const m = mpp(cam.z);
  cam.x -= dx*m; cam.y -= dy*m; cam.tx = cam.x; cam.ty = cam.y;
  clampCam();
});
function endPtr(e){ ptrs.delete(e.pointerId); pinchD = 0;
  if(!ptrs.size) canvas.classList.remove('drag'); }
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('dblclick', e => zoomAt(e.clientX,e.clientY,-1));

window.addEventListener('keydown', e => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const i = LEVELS.indexOf(nearest(cam.z));
  if(e.key === 'ArrowLeft' || e.key === 'ArrowDown' || e.key === 'PageDown'){ goLevel(i-1); e.preventDefault(); }
  else if(e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'PageUp'){ goLevel(i+1); e.preventDefault(); }
  else if(e.key === '+' || e.key === '=' ){ cam.tz = clamp(cam.tz-.8,MINZ,MAXZ); autoOn=false; syncAuto(); }
  else if(e.key === '-' || e.key === '_' ){ cam.tz = clamp(cam.tz+.8,MINZ,MAXZ); autoOn=false; syncAuto(); }
  else if(e.key === ' '){ autoOn = !autoOn; syncAuto(); e.preventDefault(); }
  else if(e.key === 'Home' || e.key === 'h' || e.key === 'р'){ goLevel(LEVELS.findIndex(L => L.e === 0)); }
  else if(e.key === 'End' || e.key === 'e' || e.key === 'у'){ goLevel(LEVELS.length-1); }
});
$('bAuto').addEventListener('click', () => { autoOn = !autoOn; syncAuto(); if(autoOn) autoDir = -1; });
$('bHome').addEventListener('click', () => goLevel(LEVELS.findIndex(L => L.e === 0)));
$('bTop').addEventListener('click', () => goLevel(LEVELS.length-1));
window.addEventListener('resize', resize);

resize();
buildRail();
cam.z = cam.tz = 0;
requestAnimationFrame(frame);

/* отладочный доступ: можно прыгнуть на любой уровень из консоли */
window.scaleApp = { cam, LEVELS, goLevel, zoomAt, visible, nearest, rate,
  jump(z){ cam.z = cam.tz = clamp(z, MINZ, MAXZ); cam.x = cam.y = cam.tx = cam.ty = 0; },
  setTime(v){ simT = v; } };
})();
</script>
